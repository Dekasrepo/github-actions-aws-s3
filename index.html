<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello from GitHub - Dekasrepo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a0e14;
    --bg-2: #131a24;
    --bg-3: #1b2432;
    --accent: #58a6ff;
    --text: #e6edf3;
    --muted: #6e7b8c;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at 50% 38%, rgba(88, 166, 255, 0.12), transparent 55%),
      linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    background-color: var(--bg-1);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* faint dot grid, like a terminal canvas */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(230, 237, 243, 0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(circle at 50% 40%, black, transparent 75%);
    pointer-events: none;
  }

  main {
    position: relative;
    width: min(90vw, 640px);
    padding: 2.5rem 2rem;
  }

  .window {
    background: rgba(19, 26, 36, 0.72);
    border: 1px solid rgba(110, 123, 140, 0.25);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(110, 123, 140, 0.2);
  }

  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
  }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .titlebar span {
    margin-left: auto;
    margin-right: auto;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .terminal-body {
    padding: 2rem 1.75rem 2.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    line-height: 1.9;
  }

  .prompt {
    color: var(--accent);
  }
  .prompt::before {
    content: "➜ ";
  }
  .path {
    color: #7ee787;
    margin-right: 0.5em;
  }

  .cmd {
    color: var(--muted);
  }

  .output {
    display: block;
    margin-top: 0.9rem;
    font-size: clamp(1.4rem, 4vw, 2.1rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  #typed::after {
    content: "";
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  footer {
    text-align: center;
    margin-top: 1.25rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <div class="window">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span>s3 ~ static-site</span>
    </div>
    <div class="terminal-body">
      <div class="prompt"><span class="path">~/dekasrepo</span><span class="cmd">echo "Hello from GitHub - Dekasrepo"</span></div>
      <span class="output" id="typed"></span><span class="cursor">&nbsp;</span>
    </div>
  </div>
  <footer>hosted on amazon s3</footer>
</main>

<script>
  const text = "Hello from GitHub - Dekasrepo";
  const el = document.getElementById('typed');
  let i = 0;
  function type() {
    if (i <= text.length) {
      el.textContent = text.slice(0, i);
      i++;
      setTimeout(type, 45);
    }
  }
  type();
</script>
</body>
</html>
